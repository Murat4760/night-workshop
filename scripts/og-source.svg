<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D14" />
      <stop offset="100%" stop-color="#14101f" />
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="94%" r="50%">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- distant skyline, right edge, quiet -->
  <g opacity="0.5">
    <rect x="980" y="360" width="46" height="180" rx="4" fill="#2A2440" />
    <rect x="1034" y="300" width="60" height="240" rx="4" fill="#2A2440" />
    <rect x="1102" y="400" width="42" height="140" rx="4" fill="#2A2440" />
    <rect x="1150" y="340" width="50" height="200" rx="4" fill="#2A2440" />
    <circle cx="1050" cy="330" r="3" fill="#7C5CFF" opacity="0.7" />
    <circle cx="1010" cy="390" r="3" fill="#FF6B4A" opacity="0.6" />
    <circle cx="1120" cy="420" r="3" fill="#7C5CFF" opacity="0.6" />
  </g>

  <!-- monitor motif, lower right -->
  <g transform="translate(860 430)">
    <rect x="0" y="0" width="230" height="150" rx="12" fill="#1B1730" stroke="#3A3257" stroke-width="3" />
    <rect x="14" y="14" width="202" height="122" rx="6" fill="url(#screen)" />
    <rect x="30" y="34" width="90" height="9" rx="4.5" fill="#E8E6F0" opacity="0.5" />
    <rect x="30" y="54" width="140" height="7" rx="3.5" fill="#E8E6F0" opacity="0.22" />
    <rect x="30" y="70" width="110" height="7" rx="3.5" fill="#E8E6F0" opacity="0.16" />
    <rect x="30" y="96" width="60" height="18" rx="9" fill="#FF6B4A" opacity="0.6" />
    <rect x="80" y="150" width="70" height="10" rx="5" fill="#3A3257" />
    <rect x="100" y="160" width="30" height="4" fill="#0D0D14" opacity="0.4" />
  </g>

  <!-- mark -->
  <rect x="96" y="118" width="22" height="22" rx="6" fill="#7C5CFF" />

  <!-- name -->
  <text x="94" y="230" font-family="Arial, sans-serif" font-size="30" letter-spacing="6" fill="#7C5CFF" font-weight="700">THE NIGHT WORKSHOP</text>
  <text x="90" y="330" font-family="Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#E8E6F0">Murad Guluzade</text>
  <text x="94" y="390" font-family="Arial, sans-serif" font-size="30" fill="#a8a4bb">Solo web developer — building after dark</text>

  <!-- bottom rule + url -->
  <line x1="94" y1="470" x2="480" y2="470" stroke="#3A3257" stroke-width="2" />
  <text x="94" y="510" font-family="Arial, sans-serif" font-size="24" fill="#7C5CFF" letter-spacing="1">muradguluzade.vercel.app</text>
</svg>
